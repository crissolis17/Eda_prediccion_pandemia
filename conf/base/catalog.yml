# =============================================================================
# NOTAS DE CONFIGURACIÓN
# =============================================================================
#
# VERSIONADO:
#   - versioned: true -> El dataset será versionado con timestamp
#   - Útil para modelos y métricas (trazabilidad de experimentos)
#   - Kedro guarda versiones en formato: YYYY-MM-DDTHH.MM.SS.sssZ
#
# FORMATOS DE ARCHIVO:
#   - CSV: Datos tabulares pequeños, fácil inspección
#   - Parquet: Datos tabulares grandes, comprimido, rápido
#   - Pickle: Objetos Python complejos (modelos, métricas)
#   - Excel: Reportes finales para stakeholders
#   - MatplotlibWriter: Imágenes PNG para visualizaciones
#
# MEMORY DATASETS:
#   - No se guardan en disco (solo en RAM durante ejecución)
#   - Útiles para datos intermedios
#   - Se pierden al finalizar el pipeline
#
# COMPATIBILIDAD:
#   - Kedro 0.18.x (sin parámetro 'layer')
#   - DVC (Data Version Control) con versioned: true
#   - Apache Airflow (paths relativos)
#   - Docker (paths independientes del sistema)

# =============================================================================
